name: Sync dev→main (v0.4.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute ahead commits
        id: ahead
        run: |
          ahead=$(git rev-list --count origin/main..origin/dev)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "commits ahead of main: $ahead"

      - name: Create PR via API
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The PR body — keep it self-contained so we don't depend on local files
          BODY=$(cat <<'BODY_EOF'
          ## Summary

          Sincronización `dev` → `main` con squash (178 commits → 1).

          Esta PR trae `main` al día con toda la evolución del repo desde el último merge (#33, `9b8167f`). Después de merge, `main` apuntará al release `v0.4.2` (tag ya creado en `03aa072` antes de la PR).

          ### What's in this PR (squashed)

          **Highlights de los 178 commits:**

          - **HU-040** VS Code prompts pack — fix crítico que motivó la sincronización
            - 7 prompts `ide/vscode/prompts/flow-{start,plan,dev,verify,rework,status,close}.prompt.md`
            - Mirror en `install.ps1` (con Flatpak-aware paths) y `install.sh`
            - `PathHelper.CopilotPromptsNative/Flatpak` (single-source of truth) en `src/FlowForge.Installer/Infrastructure/PathHelper.cs`
            - `DoctorCommand` extendido con 3 checks (instructions, native prompts, Flatpak prompts)
            - ADR-027 (vscode-prompts-pack, accepted) + renumber 011→027, 026→028
          - **HU-041** installer-updater-parity (draft, 4 defects D1–D4 documentados)
          - **Engram 1.3.0** integration + 70 observations
          - **Engram-flow memory strategy** + sync convention
          - **FlowDoc v2.0 adopter** + 9 skills (flowdoc-hu, flowdoc-assist, etc.)
          - **5 ADRs nuevas** en `docs/decisions/` (005-flowdoc-discovery-skills, 006-agent-skill-omission-policy, 007-config-parity, 008-intake-overlay, etc.)
          - **18 docs files** actualizados (arquitectura, estrategia, gaps, roadmap, riesgos)
          - **`releases/v0.4.2`** publicado con 4 assets (linux-x64, win-x64.exe + sha256)
          - **`CHANGELOG.md`** actualizado a v0.4.2 (commit `25616e4`)

          ### Verification done before opening

          - [x] `dotnet build` → 0 errors, 0 warnings
          - [x] `dotnet test` → 273/273 passing
          - [x] `bash -n ide/install.sh` → valid syntax
          - [x] PowerShell parse → valid
          - [x] YAML frontmatter en 7 prompts → valid
          - [x] `flowforge doctor` runs (PM-VSC-2 manual test)
          - [x] `flowforge install` no-op en máquina real (PM-VSC-1)
          - [x] `flowforge status` shows 7 prompts installed (PM-VSC-7)
          - [x] Real-machine smoke test of all 7 `/flow-*` slash commands

          ### Strategy

          - **Squash merge**: 178 commits internos de `dev` colapsan a 1 commit de release en `main`.
          - **Rationale**: `main` es la rama de **deployed milestones**; el detalle histórico vive en `dev` y los ADRs.
          - **Tag**: `v0.4.2` ya está en `03aa072` (justo antes del CHANGELOG). Después de squash-merge, apuntará al merge commit.

          ### After merge

          1. `main` will be at v0.4.2 (1 squash commit + tag updated)
          2. `dev` will continue independently for HU-041+ work
          3. Future ADRs / HUs land on `dev` per existing convention

          ### Related

          - ADR-024: dev branch as integration lane
          - ADR-008: VS Code path matrix (modified by ADR-027)
          - HU-040: closes
          - HU-041: still open, lands on dev

          ---

          [bot] Generated by FlowForge Actions on-demand sync from dev to main after v0.4.2 release.
          BODY_EOF
          )

          # Trim leading whitespace
          BODY=$(printf '%s' "$BODY" | sed 's/^          //')

          # Build JSON payload safely
          PAYLOAD=$(jq -n \
            --arg title "sync(dev) v0.4.2 [HU-040 VS Code prompts pack]" \
            --arg head "dev" \
            --arg base "main" \
            --arg body "$BODY" \
            '{title: $title, head: $head, base: $base, body: $body, maintainer_can_modify: true}')

          HTTP=$(curl -sS -o /tmp/pr.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST \
            "https://api.github.com/repos/efreet111/FlowForge/pulls" \
            -d "$PAYLOAD")
          echo "HTTP=$HTTP"
          cat /tmp/pr.json | jq '{number: .number, html_url: .html_url, state: .state, message: .message}'

          if [ "$HTTP" -lt 300 ]; then
            PR_URL=$(jq -r '.html_url' /tmp/pr.json)
            PR_NUMBER=$(jq -r '.number' /tmp/pr.json)
            echo "PR_URL=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "✓ PR created: $PR_URL"
          else
            echo "✗ Failed to create PR (HTTP $HTTP)"
            cat /tmp/pr.json
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          echo "✅ PR #${{ steps.create.outputs.PR_NUMBER }} created"
          echo "URL: ${{ steps.create.outputs.PR_URL }}"
          echo "Next: open the PR and click **Squash and merge**"
